<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BTS News Hub</title>

    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"> 💜 BTS NEWS HUB </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="news.html"> News </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="contact.html"> Contact </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
      <div class="container">
        <div class="row align-items-center min-vh-100">
          <div class="col-lg-6">
            <span class="badge bg-purple mb-3"> 🔥 Trending KPOP News </span>

            <h1 class="display-3 fw-bold">BTS NEWS TODAY 💜</h1>

            <p class="lead mt-3">
              Website berita BTS terbaru, comeback, konser, album terbaru, dan
              update member BTS.
            </p>

            <a href="news.html" class="btn btn-dark btn-lg mt-3">
              Lihat Berita
            </a>
          </div>

          <div class="col-lg-6 text-center">
            <img src="images/bts7.png" class="img-fluid hero-img" />
          </div>
        </div>
      </div>
    </section>

    <!-- BTS CAROUSEL -->
    <section class="pb-5">
      <div class="container">
        <div
          id="btsSlider"
          class="carousel slide shadow rounded-4 overflow-hidden"
          data-bs-ride="carousel"
        >
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="images/bts6.png" class="d-block w-100 slider-img" />
            </div>

            <div class="carousel-item">
              <img src="images/bts7.png" class="d-block w-100 slider-img" />
            </div>

            <div class="carousel-item">
              <img src="images/bts9.png" class="d-block w-100 slider-img" />
            </div>

            <div class="carousel-item">
              <img src="images/bts8.png" class="d-block w-100 slider-img" />
            </div>
          </div>

          <!-- BUTTON PREV -->
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#btsSlider"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon"></span>
          </button>

          <!-- BUTTON NEXT -->
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#btsSlider"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center p-4">
      <p class="mb-0">© 2026 BTS News Hub 💜</p>
    </footer>

    <!-- JS -->
    <script src="js/main.js"></script>

    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

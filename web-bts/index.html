<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTS News Hub</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"> 💜 BTS NEWS HUB </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="news.html">News</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
      <div class="container">
        <div class="row align-items-center min-vh-100">
          <div class="col-lg-6">
            <span class="badge bg-purple mb-3"> 🔥 Trending KPOP News </span>

            <h1 class="display-3 fw-bold">BTS NEWS TODAY 💜</h1>

            <p class="lead mt-3">
              Website berita BTS terbaru, comeback, konser, album terbaru, dan
              update member BTS.
            </p>

            <a href="news.html" class="btn btn-lg btn-dark mt-3">
              Lihat Berita
            </a>
          </div>

          <div class="col-lg-6 text-center">
            <img src="images/bts6.jpg" class="img-fluid hero-img" />
          </div>
        </div>
      </div>
    </section>

    <!-- API NEWS -->
    <section class="py-5 bg-light">
      <div class="container">
        <div class="text-center mb-5">
          <h2 class="fw-bold">🔥 Berita BTS Viral</h2>
        </div>

        <div class="row" id="newsContainer">
          <div class="text-center">
            <div class="spinner-border text-dark"></div>
            <p>Loading news...</p>
          </div>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center p-4">
      <p class="mb-0">© 2026 BTS News Hub 💜</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

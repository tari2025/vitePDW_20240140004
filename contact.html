<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact | BTS News Hub</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"> 💜 BTS NEWS HUB </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="news.html"> News </a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="contact.html"> Contact </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- CONTACT SECTION -->
    <div class="container pt-5 mt-5">
      <div class="text-center mb-5">
        <h1 class="fw-bold display-5">💜 Contact BTS News Hub</h1>

        <p class="text-muted">
          Hubungi kami untuk update berita BTS terbaru ✨
        </p>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card shadow border-0 rounded-4 p-5">
            <div class="text-center mb-4">
              <img
                src="https://cdn-icons-png.flaticon.com/512/3048/3048122.png"
                width="100"
              />
            </div>

            <div class="mb-4">
              <h5 class="fw-bold">📞 Nomor HP</h5>

              <p class="text-muted">+82 10-5678-1234</p>
            </div>

            <div class="mb-4">
              <h5 class="fw-bold">📧 Email</h5>

              <p class="text-muted">btsnewshub@gmail.com</p>
            </div>

            <div class="mb-4">
              <h5 class="fw-bold">📸 Instagram</h5>

              <p class="text-muted">@btsnewshub</p>
            </div>

            <div class="mb-4">
              <h5 class="fw-bold">📘 Facebook</h5>

              <p class="text-muted">BTS News Official</p>
            </div>

            <div class="mb-4">
              <h5 class="fw-bold">🌐 Website</h5>

              <p class="text-muted">www.btsnewshub.com</p>
            </div>

            <button class="btn btn-dark w-100 rounded-pill py-2">
              💜 Follow BTS News
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center p-4 mt-5">
      <p class="mb-0">© 2026 BTS News Hub 💜</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
